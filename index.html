<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build A Boat Block Weight Finder</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #4a90e2;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #bbb;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 12px 20px;
            box-sizing: border-box;
            border: 2px solid #4a90e2;
            border-radius: 8px;
            background-color: #2a2a35;
            color: white;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            box-shadow: 0 0 8px #4a90e2;
        }
        button {
            padding: 12px 20px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }
        button:hover {
            background-color: #357abd;
        }
        button:active {
            transform: scale(0.98);
        }
        #result-container {
            margin-top: 10px;
        }
        .block-item {
            background-color: #2a2a35;
            padding: 15px;
            margin: 8px 0;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid #4a90e2;
            animation: fadeIn 0.2s ease-in-out;
        }
        .block-name {
            font-weight: bold;
            text-align: left;
            padding-right: 10px;
        }
        .block-weight {
            color: #2ecc71;
            font-weight: bold;
            white-space: nowrap;
        }
        .no-match {
            color: #e74c3c;
            font-style: italic;
            margin-top: 20px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

    <div class="subtitle">Search or view all blocks ordered from lightest to heaviest</div>
    
    <div class="controls">

            { name: "Monster truck front / back wheel", weight: "3450 ± 9 kg" },
            { name: "Soccer ball", weight: "6544.985 kg" }
        ];

        let showingAll = false;

        function displayBlocks(list) {
            const container = document.getElementById('result-container');
            container.innerHTML = ''; 

            if (list.length === 0) {
                container.innerHTML = '<div class="no-match">No blocks found matching that name.</div>';
                return;
            }

            list.forEach(block => {
                const item = document.createElement('div');
                item.className = 'block-item';
                item.innerHTML = `
                    <span class="block-name">${block.name}</span>
                    <span class="block-weight">${block.weight}</span>
                `;
                container.appendChild(item);
            });
        }

        function filterBlocks() {
            const query = document.getElementById('search-bar').value.toLowerCase().trim();

            if (query === '') {
                if (showingAll) {
                    displayBlocks(blockData);
                } else {
                    document.getElementById('result-container').innerHTML = '';
                }
                return;
            }

            const matches = blockData.filter(block => block.name.toLowerCase().includes(query));
            displayBlocks(matches);
        }

        function toggleAllBlocks() {
            const button = document.getElementById('toggle-btn');
            const searchBar = document.getElementById('search-bar');

            if (!showingAll) {
                showingAll = true;
                button.innerText = "Clear List";
                button.style.backgroundColor = "#e74c3c"; // Quotes fixed!
                searchBar.value = ''; 
                displayBlocks(blockData);
            } else {
                showingAll = false;
                button.innerText = "Show All Blocks";
                button.style.backgroundColor = "#4a90e2"; // Quotes fixed!
                searchBar.value = '';
                document.getElementById('result-container').innerHTML = '';
            }
        }
